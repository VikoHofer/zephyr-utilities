[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyr-utilities"
version = "0.2.0"
description = "Local development and analysis tools for Zephyr workspaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "pyserial>=3.5,<4", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "setuptools>=77"]

[project.scripts]
zephyr-utils = "zephyr_utilities.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"zephyr-utils" = ["E402"]
"tests/test_api.py" = ["E402"]
"scripts/*.py" = ["E402"]
